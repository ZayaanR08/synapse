<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synapse">
<meta name="theme-color" content="#e6ecf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c171c" media="(prefers-color-scheme: dark)">
<meta name="description" content="Brain-training games for attention, memory, flexibility, speed and problem solving.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Synapse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed one-screen app. Header, active tab view, bottom tab bar; games run in a full-screen layer above. Nothing scrolls. */
:root {
  --bg: #e6ecf0;
  --surface: #d8e1e7;
  --tile: #c2ced7;
  --edge: #a9b9c4;
  --ink: #0f2129;
  --muted: #536771;
  --glow: #d97f0a;
  --glow-soft: rgba(217, 127, 10, 0.22);
  --good: #13886a;
  --bad: #c9472f;
  --on-accent: #ffffff;
  --sk-attention: #2f6fb0;
  --sk-memory: #c77a0a;
  --sk-flexibility: #7a4fc0;
  --sk-speed: #13886a;
  --sk-logic: #c24a6a;
  --c-red: #d23c3c;
  --c-blue: #2766d1;
  --c-green: #17924e;
  --c-purple: #8044c8;
  --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c171c;
    --surface: #122228;
    --tile: #1c333d;
    --edge: #2a4652;
    --ink: #e3ecef;
    --muted: #8ba1aa;
    --glow: #ffb03b;
    --glow-soft: rgba(255, 176, 59, 0.24);
    --good: #3cc79c;
    --bad: #ff7458;
    --on-accent: #0c171c;
    --sk-attention: #6aa8e8;
    --sk-memory: #ffb03b;
    --sk-flexibility: #b393f0;
    --sk-speed: #3cc79c;
    --sk-logic: #f08aa5;
    --c-red: #ff6b6b;
    --c-blue: #6fa3ff;
    --c-green: #4fd08a;
    --c-purple: #b98cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c171c;
  --surface: #122228;
  --tile: #1c333d;
  --edge: #2a4652;
  --ink: #e3ecef;
  --muted: #8ba1aa;
  --glow: #ffb03b;
  --glow-soft: rgba(255, 176, 59, 0.24);
  --good: #3cc79c;
  --bad: #ff7458;
  --on-accent: #0c171c;
  --sk-attention: #6aa8e8;
  --sk-memory: #ffb03b;
  --sk-flexibility: #b393f0;
  --sk-speed: #3cc79c;
  --sk-logic: #f08aa5;
  --c-red: #ff6b6b;
  --c-blue: #6fa3ff;
  --c-green: #4fd08a;
  --c-purple: #b98cff;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 var(--font-display);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; margin: 0; -webkit-appearance: none; appearance: none; }
button:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }

.pad {
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { position: fixed; inset: 0; overflow: hidden; display: flex; justify-content: center; }
.shell { width: 100%; max-width: 480px; height: 100%; min-height: 0; display: flex; flex-direction: column; }
.screen { position: absolute; inset: 0; z-index: 5; background: var(--bg); display: flex; justify-content: center; overflow: hidden; }

/* ---------- shared type ---------- */
.eyebrow {
  margin: 0;
  font: 500 11px/1.25 var(--font-data);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.title {
  margin: 0;
  font-size: 30px;
  line-height: 1.05;
  font-weight: 750;
  letter-spacing: -0.025em;
  font-variation-settings: "opsz" 96;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.spacer { flex: 1; min-height: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sk, var(--glow)); flex: none; }

/* ---------- buttons ---------- */
.primary, .secondary {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px 20px;
  font: 700 17px/1 var(--font-display);
  letter-spacing: 0.01em;
  cursor: pointer;
  touch-action: manipulation;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.primary { color: var(--bg); background: var(--ink); }
.primary:active { background: color-mix(in srgb, var(--ink) 85%, var(--glow)); }
.secondary { color: var(--ink); background: transparent; box-shadow: inset 0 0 0 1px var(--edge); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font: 500 13px/1 var(--font-data);
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--edge);
  border-radius: 999px;
  padding: 8px 12px 8px 8px;
  cursor: pointer;
}
.chip-btn svg { width: 16px; height: 16px; }
.icon-btn {
  width: 40px; height: 40px; flex: none;
  border-radius: 12px;
  border: 1px solid var(--edge);
  background: transparent;
  display: grid; place-items: center;
  color: var(--muted);
  cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- main shell ---------- */
.app-head { display: flex; align-items: center; justify-content: space-between; padding-block: 2px 12px; }
.wordmark { font-size: 26px; font-weight: 780; letter-spacing: -0.03em; line-height: 1; font-variation-settings: "opsz" 96; }
.wordmark i { font-style: normal; color: var(--glow); }
.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden; padding-bottom: 12px; }
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-top: 1px solid var(--edge); padding-top: 6px; }
.tab {
  background: none; border: 0; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 0;
  color: var(--muted);
  font: 600 10.5px/1 var(--font-data);
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { color: var(--glow); }

/* Today */
.today-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.streak { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.streak b { font: 600 30px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.streak span { font: 500 11px/1 var(--font-data); color: var(--muted); }
.cards { display: flex; flex-direction: column; gap: 10px; }
.gcard {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px 14px;
  border: 0; border-radius: 14px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--edge);
  cursor: pointer;
}
.gcard.nonum { grid-template-columns: 1fr auto; }
.gcard:active { background: var(--tile); }
.gcard .num { font: 600 13px var(--font-data); color: var(--muted); width: 18px; }
.gcard .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gcard .skill { display: flex; align-items: center; gap: 6px; font: 500 11px/1.2 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.gcard .name { font-size: 19px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.gcard .blurb { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard .right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font: 600 15px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.gcard .right small { font: 500 10.5px/1 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.gcard .right.new { font-size: 12px; color: var(--muted); }
.gcard.done { background: transparent; }
.gcard.done .right { color: var(--good); flex-direction: row; align-items: center; gap: 4px; font-size: 13px; }
.gcard.done .right svg { width: 18px; height: 18px; }
.why { margin: 0; font-size: 13px; color: var(--muted); }

/* Games */
.skilltabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 3px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); }
.skilltabs button { border: 0; background: transparent; border-radius: 11px; padding: 9px 0; font: 600 12px/1 var(--font-display); color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.skilltabs button .dot { width: 6px; height: 6px; }
.skilltabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 0 var(--edge); }

/* Stats */
.sumrow { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); }
.sum { padding-block: 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sum + .sum { padding-left: 12px; border-left: 1px solid var(--edge); }
.sum .val { font: 600 24px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.skillrows { display: flex; flex-direction: column; gap: 14px; }
.srow { display: grid; grid-template-columns: 116px 1fr 40px; align-items: center; gap: 10px; }
.srow .nm { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; }
.bar { height: 10px; border-radius: 5px; background: var(--tile); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--sk); }
.srow .v { font: 600 15px var(--font-data); text-align: right; font-variant-numeric: tabular-nums; }
.srow.empty .v { color: var(--muted); font-weight: 500; }

/* Intro */
.intro { display: flex; flex-direction: column; gap: 18px; height: 100%; min-height: 0; padding-bottom: 6px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.skilltag { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.gtitle { margin: 0; font-size: 46px; line-height: 0.98; font-weight: 780; letter-spacing: -0.035em; font-variation-settings: "opsz" 96; text-wrap: balance; }
.basis { margin: 8px 0 0; font: 500 12px/1.4 var(--font-data); color: var(--muted); }
.how { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: step; }
.how li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 16px; line-height: 1.35; }
.how li::before {
  counter-increment: step; content: counter(step);
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  font: 600 12px/1 var(--font-data);
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 12px/1 var(--font-data); padding: 7px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--edge); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Play */
.play { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
.hud { display: grid; grid-template-columns: 40px 1fr 72px; align-items: center; gap: 10px; }
.hud .gname { text-align: center; font-weight: 700; font-size: 17px; line-height: 1.1; display: flex; flex-direction: column; gap: 3px; }
.hud .lv { font: 500 11px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.hud .score { font: 600 24px/1 var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
.meter-row { display: grid; grid-template-columns: 1fr 26px; align-items: center; gap: 8px; height: 14px; }
.meter { height: 6px; border-radius: 3px; background: var(--tile); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--glow); transform-origin: left center; }
.meter i.low { background: var(--bad); }
.tleft { font: 600 12px/1 var(--font-data); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.lifebar { display: flex; gap: 7px; justify-content: center; align-items: center; height: 14px; }
.lifebar i { width: 12px; height: 12px; border-radius: 50%; background: var(--glow); border: 1.5px solid var(--glow); transition: background 0.2s, border-color 0.2s; }
.lifebar i.lost { background: transparent; border-color: var(--edge); }
.pmsg { margin: 0; min-height: 2.7em; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; font-weight: 550; line-height: 1.3; text-wrap: balance; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 22px; transition: box-shadow 0.15s; padding-bottom: 6px; }
.stage.ok { box-shadow: 0 0 0 2px var(--good); }
.stage.bad { box-shadow: 0 0 0 2px var(--bad); }

/* Results */
.res { display: flex; flex-direction: column; gap: 16px; height: 100%; min-height: 0; padding-bottom: 6px; }
.res .big { font: 600 clamp(56px, 17vw, 88px)/0.95 var(--font-data); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.res .unit { font: 500 13px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.badge { align-self: flex-start; font: 600 11px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px; background: var(--glow); color: var(--on-accent); }
.note { margin: 0; font-size: 14px; color: var(--muted); }

/* Settings */
.set-list { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--edge); }
.set-item { padding-block: 14px; border-bottom: 1px solid var(--edge); display: flex; flex-direction: column; gap: 6px; }
.set-item.row { flex-direction: row; align-items: center; justify-content: space-between; }
.set-item h3 { margin: 0; font-size: 16px; font-weight: 700; }
.set-item p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.4; }
.switch { width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; background: var(--tile); cursor: pointer; display: flex; transition: background 0.15s; }
.switch i { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 0.15s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"] i { transform: translateX(20px); }
.danger-btn { align-self: flex-start; border: 1px solid var(--bad); color: var(--bad); background: transparent; border-radius: 12px; padding: 10px 14px; font: 600 14px/1 var(--font-display); cursor: pointer; }
.danger-btn.armed { background: var(--bad); color: var(--on-accent); }

/* ---------- game parts ---------- */
.g-col { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.g-stim { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; container-type: size; }
.g-resp { flex: none; display: grid; gap: 10px; }
.g-resp.two, .g-resp.four { grid-template-columns: 1fr 1fr; }
.rbtn {
  height: clamp(50px, 8.5dvh, 68px);
  border: 0; border-radius: 16px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--edge), inset 0 -3px 0 var(--edge);
  font: 700 18px/1 var(--font-display);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer;
  touch-action: manipulation;
  transition: opacity 0.12s;
}
.rbtn:active { background: var(--tile); }
.rbtn[aria-disabled="true"] { opacity: 0.4; cursor: default; }
.rbtn svg { width: 30px; height: 30px; }
.rbtn.num { font: 600 24px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.rbtn.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.sq-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.sq { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); position: relative; }
.board-bg {
  border-radius: 22px;
  background-color: var(--surface);
  background-image: radial-gradient(var(--edge) 1px, transparent 1.6px);
  background-size: 22px 22px;
  background-position: 11px 11px;
  box-shadow: inset 0 0 0 1px var(--edge);
}
.shape { width: 100%; height: 100%; display: block; }
.tag { font: 500 12px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); min-height: 1em; }
.card {
  width: min(44cqw, 44cqh, 210px); aspect-ratio: 1;
  border-radius: 26px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--edge);
  display: grid; place-items: center;
  padding: 17%;
  color: var(--ink);
}
.glyph { font: 600 min(24cqw, 24cqh, 110px)/1 var(--font-data); }
.pop { animation: pop 0.2s ease-out; }
.fadein { animation: fadein 0.16s ease-out; }
@keyframes pop { from { transform: scale(0.86); opacity: 0.3; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* Crosswind */
.arrow-row { display: flex; gap: min(8px, 1.4cqw); color: var(--ink); }
.arrow-row svg { width: min(52px, 9.4cqw); height: min(52px, 9.4cqw); }
.arrow-row.masked svg { opacity: 0; }

/* Odd One Out */
.ring-grid { display: grid; gap: 4px; padding: 6px; }
.ring-cell { border: 0; background: transparent; border-radius: 12px; padding: 14%; color: var(--ink); cursor: pointer; }
.ring-cell.reveal { background: var(--glow-soft); box-shadow: inset 0 0 0 2px var(--glow); }
.ring-cell.wrong { color: var(--bad); }

/* Tracker */
.tdot {
  position: absolute; width: 11%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: var(--tile);
  box-shadow: inset 0 0 0 1.5px var(--edge), inset 0 -3px 0 var(--edge);
  cursor: pointer;
}
.tdot.target { background: var(--glow); box-shadow: 0 0 0 5px var(--glow-soft); }
.tdot.found { background: var(--good); box-shadow: none; }
.tdot.wrong { background: var(--bad); box-shadow: none; }
.tdot.reveal { box-shadow: 0 0 0 3px var(--glow); }

/* Light Trail */
.lt-trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lt-seg { fill: none; stroke-width: 4; stroke-linecap: round; opacity: 0; transition: opacity 0.18s; }
.lt-seg.show { stroke: var(--glow); }
.lt-seg.show.on { opacity: 0.9; }
.lt-seg.user { stroke: var(--muted); }
.lt-seg.user.on { opacity: 0.45; }
.lt-trail.fading .lt-seg { opacity: 0; }
.lt-tile {
  position: absolute; width: 17%; aspect-ratio: 1; padding: 0;
  transform: translate(-50%, -50%);
  border-radius: 22%;
  border: 1px solid var(--edge);
  background: var(--tile);
  box-shadow: inset 0 -4px 0 var(--edge);
  display: flex; align-items: center; justify-content: center;
  font: 600 clamp(14px, 4.4cqw, 20px)/1 var(--font-data);
  color: var(--ink);
  cursor: pointer;
  transition: background 0.12s, box-shadow 0.12s, border-color 0.12s;
}
.lt-tile.lit, .lt-tile.tap { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 0 6px var(--glow-soft), 0 0 30px var(--glow-soft); }
.lt-tile.reveal { border-color: var(--glow); box-shadow: inset 0 0 0 2px var(--glow); }
.lt-tile.wrong { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.lt-tile[data-order]::after { content: attr(data-order); }

/* Flash Grid */
.fg-grid { position: absolute; inset: 0; display: grid; gap: 6px; padding: 10px; }
.fg-cell { border: 0; padding: 0; border-radius: 10px; background: var(--tile); box-shadow: inset 0 -3px 0 var(--edge); cursor: pointer; transition: background 0.1s; }
.fg-cell.lit { background: var(--glow); box-shadow: 0 0 0 4px var(--glow-soft); }
.fg-cell.found { background: var(--good); box-shadow: none; }
.fg-cell.wrong { background: var(--bad); box-shadow: none; }
.fg-cell.reveal { box-shadow: inset 0 0 0 3px var(--glow); }

/* Number Chain + keypad */
.digit-big { font: 600 min(34cqh, 30cqw, 150px)/1 var(--font-data); min-height: 1em; font-variant-numeric: tabular-nums; }
.digit-big.answer { font-size: min(9cqw, 34px); letter-spacing: 0.12em; color: var(--muted); }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.slot { width: min(8.5cqw, 40px); height: min(11cqw, 48px); border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--edge); display: grid; place-items: center; font: 600 min(6cqw, 24px)/1 var(--font-data); }
.slot.ok { box-shadow: inset 0 0 0 2px var(--good); }
.slot.wrong { background: var(--bad); color: var(--on-accent); box-shadow: none; }
.slot.reveal { color: var(--muted); }
.keypad { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {
  height: clamp(42px, 7dvh, 58px);
  border: 0; border-radius: 14px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--edge), inset 0 -3px 0 var(--edge);
  font: 600 22px/1 var(--font-data);
  color: var(--ink);
  display: grid; place-items: center;
  cursor: pointer;
  touch-action: manipulation;
}
.key:active { background: var(--tile); }
.key svg { width: 26px; height: 26px; }
.key.blank { visibility: hidden; }
.key[aria-disabled="true"] { opacity: 0.4; }

/* Rule Flip */
.rf { width: min(100%, 380px); height: min(100%, 360px); display: grid; grid-template-rows: 1fr 1fr; border-radius: 20px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--edge); }
.rf-half { position: relative; display: flex; align-items: center; justify-content: center; background: var(--surface); }
.rf-half + .rf-half { border-top: 1.5px dashed var(--edge); }
.rf-half .lbl { position: absolute; top: 10px; left: 12px; font: 500 11px/1.2 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.rf-card { font: 700 min(13cqh, 56px)/1 var(--font-data); padding: 12px 22px; border-radius: 14px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--ink); letter-spacing: 0.04em; }

/* Color Clash */
.cc-cue { font: 600 12px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--edge); }
.cc-cue.alt { background: var(--ink); color: var(--bg); box-shadow: none; }
.cc-word { font: 800 min(15cqw, 22cqh, 76px)/1 var(--font-display); letter-spacing: 0.02em; min-height: 1em; }
.sw { width: 18px; height: 18px; border-radius: 5px; background: var(--c); flex: none; }

/* Turnabout */
.ta-box { position: absolute; left: 50%; top: 50%; width: min(32cqw, 32cqh, 140px); aspect-ratio: 1; border-radius: 22px; display: grid; place-items: center; color: var(--ink); }
.ta-box.solid { border: 5px solid var(--ink); }
.ta-box.dashed { border: 5px dashed var(--glow); }
.ta-box svg { width: 58%; height: 58%; }
.ta-tag { position: absolute; bottom: -24px; font: 500 11px/1 var(--font-data); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.dpad { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Green Light */
.gl-zone { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.gl-target { position: absolute; padding: 0; border: 0; transform: translate(-50%, -50%); cursor: pointer; animation: fadein 0.1s ease-out; }
.gl-target.go { border-radius: 50%; background: var(--good); }
.gl-target.nogo { border-radius: 10px; background: var(--bad); }
.gl-target.hit { opacity: 0.35; }
.gl-target.wrong { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Flash Count */
.fc-dot { position: absolute; width: 8.5%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); transform: translate(-50%, -50%); }
.fc-fix { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 500 30px/1 var(--font-data); color: var(--muted); }

/* Quick Math */
.qm-zone { flex: 1; min-height: 90px; position: relative; overflow: hidden; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); }
.qm-zone::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--bad); opacity: 0.55; }
.qm-card { position: absolute; left: 50%; top: 10px; white-space: nowrap; font: 600 clamp(24px, 7vw, 36px)/1 var(--font-data); padding: 12px 18px; border-radius: 14px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--ink); }
.qm-card.ok { box-shadow: inset 0 0 0 2px var(--good); }
.qm-card.wrong { box-shadow: inset 0 0 0 2px var(--bad); }
.entry { flex: none; text-align: center; font: 600 28px/1.2 var(--font-data); letter-spacing: 0.06em; min-height: 1.2em; font-variant-numeric: tabular-nums; }
.entry.empty { color: var(--muted); }

/* Pathfinder */
.pf-grid { position: absolute; inset: 0; display: grid; gap: 3px; padding: 8px; }
.pf-cell { border: 0; padding: 0; border-radius: 7px; background: var(--tile); display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.pf-cell.wall { background: var(--ink); opacity: 0.82; cursor: default; }
.pf-cell.path { background: var(--glow-soft); box-shadow: inset 0 0 0 2px var(--glow); }
.pf-cell.head { background: var(--glow); }
.pf-cell.start::after { content: ""; width: 38%; height: 38%; border-radius: 50%; background: var(--ink); }
.pf-cell svg { width: 62%; height: 62%; }

/* Next Up */
.nu-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-inline: 4px; }
.nu-num { min-width: min(15cqw, 64px); padding: 14px 8px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); font: 600 min(6.5cqw, 26px)/1 var(--font-data); text-align: center; font-variant-numeric: tabular-nums; }
.nu-num.q { background: transparent; box-shadow: inset 0 0 0 2px var(--glow); color: var(--glow); }
.nu-num.ok { box-shadow: inset 0 0 0 2px var(--good); color: var(--good); }
.nu-num.wrong { box-shadow: inset 0 0 0 2px var(--bad); color: var(--bad); }

@media (max-height: 640px) {
  .title { font-size: 25px; }
  .gtitle { font-size: 36px; }
  .gcard { padding: 9px 12px; }
  .gcard .name { font-size: 17px; }
  .view { gap: 10px; }
  .intro { gap: 12px; }
  .how { gap: 8px; }
  .how li { font-size: 15px; }
  .skillrows { gap: 10px; }
  .primary, .secondary { padding: 14px 18px; }
  .wordmark { font-size: 22px; }
  .app-head { padding-bottom: 8px; }
}
@media (max-height: 540px) {
  .gcard .blurb, .why, .note, .basis { display: none; }
  .pmsg { min-height: 1.4em; }
}
@media (prefers-reduced-motion: reduce) {
  .pop, .fadein, .gl-target { animation: none; }
  .lt-seg, .lifebar i, .switch i, .stage { transition: none; }
}
</style>

<body>


<div id="app" class="pad">
  <div class="shell" id="main">
    <header class="app-head">

      <button type="button" class="tab" role="tab" data-tab="games" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></g></svg><span>Games</span></button>
      <button type="button" class="tab" role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>Stats</span></button>
    </nav>
  </div>

  <section class="screen pad" id="introScreen" hidden><div class="shell" id="introBody"></div></section>

  <section class="screen pad" id="playScreen" hidden>
    <div class="shell play">
      <div class="hud">
        <button type="button" class="icon-btn" id="quitBtn" aria-label="Quit game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <div class="gname"><span id="hudName"></span><span class="lv" id="hudLv">Level 1</span></div>

  <section class="screen pad" id="resultScreen" hidden><div class="shell" id="resultBody"></div></section>
  <section class="screen pad" id="settingsScreen" hidden><div class="shell" id="settingsBody"></div></section>
</div>

<script>
(() => {
  'use strict';

  // ================= helpers =================
  const $ = (s) => document.querySelector(s);
  const SVGNS = 'http://www.w3.org/2000/svg';
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function button(html, cls, fn, label, fast) {
    const b = document.createElement('button');
    b.type = 'button';
    if (cls) b.className = cls;
    b.innerHTML = html;
    if (label) b.setAttribute('aria-label', label);
    const off = () => b.getAttribute('aria-disabled') === 'true';
    if (fn) {
      if (fast) {
        b.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          e.preventDefault();
          if (!off()) fn(e);
        });
        b.addEventListener('click', (e) => { if (e.detail === 0 && !off()) fn(e); });
      } else {
        b.addEventListener('click', (e) => { if (!off()) fn(e); });
      }
    }
    return b;
  }
  const setOff = (btns, off) => btns.forEach((b) => b.setAttribute('aria-disabled', off ? 'true' : 'false'));
  const rand = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rand(a.length)];
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const range = (a, b) => a + rand(b - a + 1);
  const restart = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

  const ICON = {
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    del: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11v12H9l-6-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9.5l5 5M17 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    flag: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>'
  };
  const ROT = { right: 0, down: 90, left: 180, up: 270 };
  const OPP = { left: 'right', right: 'left', up: 'down', down: 'up' };
  const arrowSVG = (dir) => `<svg viewBox="0 0 24 24" style="transform:rotate(${ROT[dir]}deg)" aria-hidden="true"><path d="M4 12h15M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const SHAPES = {
    circle: '<circle cx="50" cy="50" r="36"/>',
    square: '<rect x="16" y="16" width="68" height="68" rx="7"/>',
    triangle: '<path d="M50 12 L90 84 H10 Z"/>',
    diamond: '<path d="M50 8 L90 50 L50 92 L10 50 Z"/>',
    star: '<path d="M50 8 L62 37 L93 39 L69 59 L77 90 L50 73 L23 90 L31 59 L7 39 L38 37 Z"/>',
    hexagon: '<path d="M28 12 H72 L94 50 L72 88 H28 L6 50 Z"/>',
    plus: '<path d="M38 10 H62 V38 H90 V62 H62 V90 H38 V62 H10 V38 H38 Z"/>',
    cross: '<path d="M26 11 L50 35 L74 11 L89 26 L65 50 L89 74 L74 89 L50 65 L26 89 L11 74 L35 50 L11 26 Z"/>'
  };
  const shapeSVG = (name) => `<svg viewBox="0 0 100 100" class="shape" aria-hidden="true"><g fill="currentColor">${SHAPES[name]}</g></svg>`;
  const landolt = (deg) => `<svg viewBox="0 0 100 100" class="shape" aria-hidden="true"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="13" stroke-dasharray="152.5 36" transform="rotate(${deg} 50 50)"/></svg>`;

  function keypad(onKey, withBack) {
    const pad = el('div', 'keypad');
    const keys = [];
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', withBack ? 'back' : '', '0', ''].forEach((k) => {
      if (!k) { pad.append(el('span', 'key blank')); return; }
      const b = button(k === 'back' ? ICON.del : k, 'key', () => onKey(k), k === 'back' ? 'Delete' : k, true);
      keys.push(b);
      pad.append(b);
    });
    return { pad, keys };
  }

  // ================= storage =================
  const STORE = 'synapse.v1';
  const fresh = () => ({ games: {}, days: {}, sound: true });
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (d && typeof d === 'object') return Object.assign(fresh(), d);
    } catch (e) { /* storage unavailable */ }
    return fresh();
  }
  let data = load();
  function save() { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) { /* storage unavailable */ } }

  // ================= sound =================
  let actx = null;
  const NOTES = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1396.91, 1567.98];
  function audioOn() {
    if (!data.sound) return;
    try {
      if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, dur = 0.16, type = 'sine', vol = 0.13, delay = 0) {
    if (!data.sound || !actx) return;
    try {
      const t = actx.currentTime + delay;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { /* ignore */ }
  }
  const sfx = {
    good() { tone(784, 0.1, 'triangle', 0.11); tone(1175, 0.15, 'triangle', 0.11, 0.07); },
    bad() { tone(150, 0.24, 'square', 0.06); },
    note(i) { tone(NOTES[((i % NOTES.length) + NOTES.length) % NOTES.length], 0.16, 'sine', 0.13); },
    tick() { tone(1250, 0.035, 'square', 0.025); },
    neutral() { tone(660, 0.12, 'triangle', 0.1); },
    end() { tone(523.25, 0.14, 'triangle', 0.11); tone(659.25, 0.14, 'triangle', 0.11, 0.12); tone(783.99, 0.22, 'triangle', 0.11, 0.24); }
  };

  // ================= skills =================
  const SKILLS = [
    { id: 'attention', name: 'Attention', short: 'Attention', desc: 'Lock onto what matters and tune out the rest.' },
    { id: 'memory', name: 'Memory', short: 'Memory', desc: 'Hold information in mind for a few seconds.' },
    { id: 'flexibility', name: 'Flexibility', short: 'Flex', desc: 'Switch between rules without mixing them up.' },
    { id: 'speed', name: 'Speed', short: 'Speed', desc: 'Take in what you see and react fast.' },
    { id: 'logic', name: 'Problem solving', short: 'Logic', desc: 'Work out answers and plan a few steps ahead.' }
  ];
  const SKILL = Object.fromEntries(SKILLS.map((s) => [s.id, s]));
  const COLORS = [
    { id: 'red', name: 'RED', label: 'Red' },
    { id: 'blue', name: 'BLUE', label: 'Blue' },
    { id: 'green', name: 'GREEN', label: 'Green' },
    { id: 'purple', name: 'PURPLE', label: 'Purple' }
  ];

  // ================= games =================
  const GAMES = [
    // ---------------- ATTENTION ----------------
    {
      id: 'crosswind', name: 'Crosswind', skill: 'attention', kind: 'timed', seconds: 45, maxLevel: 8,
      basis: 'the flanker task',
      blurb: 'Pick out the middle arrow in a noisy row.',
      how: ['A row of arrows appears.', 'Tap the way the middle arrow points.', 'Ignore the arrows beside it.'],
      start(api) {
        const col = el('div', 'g-col'), stim = el('div', 'g-stim'), row = el('div', 'arrow-row');
        stim.append(row);
        const resp = el('div', 'g-resp two');
        let target = null, ready = false, tid = 0;
        const answer = (d) => {
          if (!ready) return;
          ready = false; tid++;
          if (d === target) { api.hit(); api.msg(''); } else api.miss('The middle arrow pointed ' + target);
          row.classList.remove('masked'); row.innerHTML = '';
          api.later(trial, 240);
        };
        resp.append(
          button(arrowSVG('left'), 'rbtn', () => answer('left'), 'Left', true),
          button(arrowSVG('right'), 'rbtn', () => answer('right'), 'Right', true)
        );
        col.append(stim, resp);
        api.stage.append(col);
        api.keys((k) => { if (k === 'ArrowLeft') answer('left'); if (k === 'ArrowRight') answer('right'); });
        function trial() {
          const lv = api.level, n = lv < 3 ? 5 : lv < 6 ? 7 : 9, mid = (n - 1) / 2;
          target = Math.random() < 0.5 ? 'left' : 'right';
          const fl = Math.random() < 0.3 + lv * 0.06 ? OPP[target] : target;
          row.innerHTML = Array.from({ length: n }, (_, i) => arrowSVG(i === mid ? target : fl)).join('');
          ready = true;
          const id = ++tid;
          if (lv >= 5) api.later(() => { if (ready && tid === id) row.classList.add('masked'); }, Math.max(450, 1100 - (lv - 5) * 200));
        }
        trial();
      }
    },
    {
      id: 'oddone', name: 'Odd One Out', skill: 'attention', kind: 'timed', seconds: 45, maxLevel: 8,
      basis: 'visual search with Landolt rings, the rings eye doctors use',
      blurb: 'Find the ring whose gap faces a different way.',
      how: ['A grid of rings appears, each with a small gap.', 'One ring has its gap facing a different way.', 'Tap it as fast as you can.'],
      start(api) {
        const wrap = el('div', 'sq-wrap'), sq = el('div', 'sq ring-grid');
        wrap.append(sq);
        api.stage.append(wrap);
        const DIFF = [180, 90, 180, 90, 90, 45, 45, 30];
        let odd = -1, ready = false, cells = [];
        function trial() {
          const lv = api.level, n = Math.min(6, 3 + Math.floor((lv - 1) / 2));
          const base = pick([0, 45, 90, 135, 180, 225, 270, 315]);
          const d = DIFF[lv - 1] * (Math.random() < 0.5 ? 1 : -1);
          odd = rand(n * n);
          sq.style.gridTemplateColumns = `repeat(${n},1fr)`;
          sq.style.gridTemplateRows = `repeat(${n},1fr)`;
          cells = Array.from({ length: n * n }, (_, i) => button(landolt(i === odd ? base + d : base), 'ring-cell', () => choose(i), 'Ring ' + (i + 1), true));
          sq.replaceChildren(...cells);
          ready = true;
        }
        function choose(i) {
          if (!ready) return;
          ready = false;
          if (i === odd) { api.hit(); api.msg(''); api.later(trial, 160); }
          else {
            cells[odd].classList.add('reveal'); cells[i].classList.add('wrong');
            api.miss('The highlighted ring was the odd one');
            api.later(trial, 850);
          }
        }
        trial();
      }
    },
    {
      id: 'tracker', name: 'Tracker', skill: 'attention', kind: 'lives', lives: 3, maxLevel: 8, upAfter: 1,
      basis: 'multiple object tracking',
      blurb: 'Keep your eyes on a few dots as they drift.',
      how: ['Some dots light up. Remember which ones.', 'Then every dot starts moving. Keep tracking the lit ones.', 'When they stop, tap the dots you tracked.'],
      start(api) {
        const wrap = el('div', 'sq-wrap'), sq = el('div', 'sq board-bg');
        wrap.append(sq);
        api.stage.append(wrap);
        const RAD = 6;
        let dots = [], phase = 'idle', found = 0, k = 0;
        function trial() {
          const lv = api.level;
          k = Math.min(5, 2 + Math.floor((lv - 1) / 2));
          const n = lv >= 5 ? 10 : 8, speed = 16 + lv * 3.2;
          sq.replaceChildren();
          dots = []; found = 0; phase = 'show';
          for (let i = 0; i < n; i++) {
            let x, y, tries = 0;

        <div class="sum"><span class="eyebrow">Tried</span><span class="val">${tried}/${GAMES.length}</span></div>
      </div>
      <div class="skillrows">${SKILLS.map((s) => {
        const sc = skillScore(s.id);
        return `<div class="srow${sc == null ? ' empty' : ''}" style="--sk:var(--sk-${s.id})">
          <span class="nm"><i class="dot"></i>${s.name}</span>
          <span class="bar"><i style="width:${sc || 0}%"></i></span>
          <span class="v">${sc == null ? '–' : sc}</span>
        </div>`;
      }).join('')}</div>
      <p class="note">Each skill score is out of 100. It shows how far you've pushed the difficulty in that skill's games over your last few rounds. It tracks your progress in these games, not your IQ.</p>`;
  }

  function openIntro(gid, workout) {
    ctx = { gid, workout: !!workout };
    const g = GAME[gid], rec = data.games[gid], sk = SKILL[g.skill];
    const plan = todayPlan();
    const pos = plan.plan.indexOf(gid);
    const body = $('#introBody');
    body.innerHTML = `
      <div class="intro">
        <div class="topbar">
          <button type="button" class="chip-btn" id="introBack">${ICON.back}Back</button>
          ${workout && pos >= 0 ? `<span class="eyebrow">Workout · game ${pos + 1} of 3</span>` : ''}
        </div>
        <div style="--sk:var(--sk-${g.skill})">
          <p class="skilltag"><i class="dot"></i>${sk.name}</p>
          <h2 class="gtitle">${g.name}</h2>
          <p class="basis">Based on ${g.basis}</p>
        </div>
        <ol class="how">${g.how.map((h) => `<li><span>${h}</span></li>`).join('')}</ol>
        <div class="chips">
          <span class="chip">${g.kind === 'timed' ? g.seconds + '-second round' : '3 lives'}</span>
          <span class="chip">${g.maxLevel} levels</span>
          <span class="chip">${rec && rec.best ? 'Best ' + rec.best : 'Not played yet'}</span>
        </div>
        <div class="spacer"></div>
        <button type="button" class="primary" id="introPlay">Play</button>
      </div>`;
    $('#introBack').addEventListener('click', goHome);
    $('#introPlay').addEventListener('click', () => startRound(g));
    show('introScreen');
  }

  // ================= round engine =================
  let R = null;
  const stage = $('#stage');
  const setMsg = (t) => { $('#playMsg').textContent = t || ''; };
  function renderHud() {
    if (!R) return;
    $('#hudLv').textContent = `Level ${R.level}`;
    $('#hudScore').textContent = R.score;
    if (R.game.kind === 'lives') [...$('#lifeBar').children].forEach((d, i) => d.classList.toggle('lost', i >= R.lives));
  }
  function flash(kind) {
    stage.classList.remove('ok', 'bad');
    void stage.offsetWidth;
    stage.classList.add(kind);
    const round = R;
    setTimeout(() => { if (R === round) stage.classList.remove(kind); }, 380);
  }
  function makeApi(round) {
    const g = round.game;
    const alive = () => R === round && !round.over && !round.ending;
    return {
      stage,
      get level() { return round.level; },
      sfx,
      msg: setMsg,
      later(fn, ms) {
        const id = setTimeout(() => { if (alive()) fn(); }, ms);
        round.timers.push(id);
        return id;
      },
      animate(fn) {
        let last = performance.now(), stopped = false;
        const loop = (now) => {
          if (stopped || !alive()) return;
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          if (fn(dt) === false) return;
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
        return () => { stopped = true; };
      },
      keys(fn) { round.onKey = fn; },
      hit(points, quiet) {
        if (!alive()) return 0;
        round.tries++; round.hits++; round.streak++;
        const pts = Math.round(points != null ? points : 10 * round.level);
        round.score += pts;
        if (round.streak >= (g.upAfter || 3)) {
          round.streak = 0;
          if (round.level < g.maxLevel) { round.level++; round.peak = Math.max(round.peak, round.level); }
        }
        if (!quiet) { flash('ok'); sfx.good(); }
        renderHud();
        return pts;
      },
      partial(points) {
        if (!alive()) return;
        round.tries++;
        round.score += Math.round(points);
        sfx.neutral();
        renderHud();
      },
      miss(text) {
        if (!alive()) return false;
        round.tries++; round.streak = 0;
        if (round.level > 1) round.level--;
        flash('bad'); sfx.bad();
        if (text) setMsg(text);
        if (g.kind === 'lives') {
          round.lives--;
          renderHud();
          if (round.lives <= 0) {
            round.ending = true;
            setTimeout(() => { if (R === round) finishRound(); }, 1600);
            return false;
          }
        }
        renderHud();
        return true;
      }
    };
  }
  function runTimer(round) {
    const dur = round.game.seconds * 1000, t0 = performance.now();
    const fill = $('#meterFill'), tl = $('#tleft');
    const tick = (now) => {
      if (R !== round || round.over) return;
      const left = Math.max(0, dur - (now - t0));
      fill.style.transform = `scaleX(${left / dur})`;
      tl.textContent = Math.ceil(left / 1000);
      fill.classList.toggle('low', left < 5000);
      if (left <= 0) { finishRound(); return; }
      round.raf = requestAnimationFrame(tick);
    };
    round.raf = requestAnimationFrame(tick);
  }
  function stopRound(round) {
    round.over = true;
    round.timers.forEach(clearTimeout);
    cancelAnimationFrame(round.raf);
    if (R === round) R = null;
  }
  function startRound(game) {
    audioOn();
    if (R) stopRound(R);
    stage.replaceChildren();
    stage.className = 'stage';
    const round = { game, level: 1, peak: 1, score: 0, hits: 0, tries: 0, streak: 0, lives: game.lives || 0, over: false, ending: false, timers: [], raf: 0, onKey: null };
    R = round;
    $('#hudName').textContent = game.name;
    $('#meterRow').hidden = game.kind !== 'timed';
    $('#lifeBar').hidden = game.kind !== 'lives';
    const fill = $('#meterFill');
    fill.style.transform = 'scaleX(1)';
    fill.classList.remove('low');
    $('#tleft').textContent = game.seconds || '';
    renderHud();
    setMsg('Get ready');
    show('playScreen');
    const api = makeApi(round);
    api.later(() => {
      setMsg('');
      if (game.kind === 'timed') runTimer(round);
      game.start(api);
    }, 700);
  }
  function finishRound() {
    const round = R;
    if (!round || round.over) return;
    stopRound(round);
    const isBest = record(round.game.id, round.score, round.peak);
    sfx.end();
    showResults(round, isBest);
  }
  $('#quitBtn').addEventListener('click', () => {
    if (R) stopRound(R);
    stage.replaceChildren();
    openIntro(ctx.gid, ctx.workout);
  });
  document.addEventListener('keydown', (e) => {
    if (R && R.onKey && !e.metaKey && !e.ctrlKey) {
      if (/^Arrow/.test(e.key) || /^[0-9]$/.test(e.key) || e.key === 'Backspace') e.preventDefault();
      R.onKey(e.key);
    }
  });

  function showResults(round, isBest) {
    const g = round.game;
    const acc = round.tries ? Math.round((round.hits / round.tries) * 100) : 0;
    const best = (data.games[g.id] || {}).best || 0;
    const plan = todayPlan();
    const nextId = ctx.workout ? plan.plan.find((id) => !plan.done.includes(id)) : null;
    const workoutDone = ctx.workout && plan.plan.includes(g.id) && !nextId;
    const body = $('#resultBody');
    body.innerHTML = `
      <div class="res">
        <div style="--sk:var(--sk-${g.skill})">
          <p class="skilltag"><i class="dot"></i>${SKILL[g.skill].name}</p>
          <h2 class="title">${g.name}</h2>
        </div>
        ${isBest ? '<span class="badge">New personal best</span>' : ''}
        <div><div class="big">${round.score}</div><span class="unit">points</span></div>
        <div class="sumrow">
          <div class="sum"><span class="eyebrow">Accuracy</span><span class="val">${acc}%</span></div>
          <div class="sum"><span class="eyebrow">Peak level</span><span class="val">${round.peak}/${g.maxLevel}</span></div>
          <div class="sum"><span class="eyebrow">Best</span><span class="val">${best}</span></div>
        </div>
        <p class="note">${workoutDone ? "That's today's workout done. Your streak is " + streak() + (streak() === 1 ? ' day.' : ' days.') : nextId ? `Next up in your workout: ${GAME[nextId].name}.` : 'Difficulty starts low each round and climbs as you get answers right.'}</p>
        <div class="spacer"></div>
        ${nextId
          ? `<button type="button" class="primary" id="resNext">Next: ${GAME[nextId].name}</button>
             <div class="btn-row"><button type="button" class="secondary" id="resAgain">Play again</button><button type="button" class="secondary" id="resDone">Done</button></div>`
          : `<button type="button" class="primary" id="resAgain">Play again</button>
             <button type="button" class="secondary" id="resDone">Done</button>`}
      </div>`;
    if (nextId) $('#resNext').addEventListener('click', () => openIntro(nextId, true));
    $('#resAgain').addEventListener('click', () => startRound(g));
    $('#resDone').addEventListener('click', goHome);
    stage.replaceChildren();
    show('resultScreen');
  }

  // ================= settings =================
  function openSettings() {
    const body = $('#settingsBody');
    body.innerHTML = `
      <div class="intro">
        <div class="topbar"><button type="button" class="chip-btn" id="setBack">${ICON.back}Back</button></div>
        <h2 class="title">Settings</h2>
        <div class="set-list">
          <div class="set-item row"><div><h3>Sound</h3><p>Tones for taps, hits and misses</p></div><button type="button" class="switch" id="soundSwitch" role="switch" aria-checked="${data.sound}" aria-label="Sound"><i></i></button></div>
          <div class="set-item"><h3>Put it on your home screen</h3><p>Open the app's link in Safari, tap Share, then Add to Home Screen. It opens full-screen like a regular app.</p></div>
          <div class="set-item"><h3>How levels work</h3><p>Every round starts easy. A run of right answers moves you up a level, a miss moves you down, so you stay near the edge of what you can do.</p></div>
          <div class="set-item"><h3>Reset progress</h3><p>Erases scores, stats and streaks on this device.</p><button type="button" class="danger-btn" id="resetBtn">Reset all progress</button></div>
        </div>
      </div>`;
    $('#setBack').addEventListener('click', goHome);
    const sw = $('#soundSwitch');
    sw.addEventListener('click', () => {
      data.sound = !data.sound;
      sw.setAttribute('aria-checked', String(data.sound));
      save();
      if (data.sound) { audioOn(); sfx.good(); }
    });
    const rb = $('#resetBtn');
    let armed = false, timer = 0;
    rb.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        rb.textContent = 'Tap again to erase everything';
        rb.classList.add('armed');
        timer = setTimeout(() => { armed = false; rb.textContent = 'Reset all progress'; rb.classList.remove('armed'); }, 3500);
        return;
      }
      clearTimeout(timer);
      armed = false;
      data = Object.assign(fresh(), { sound: data.sound });
      save();
      rb.textContent = 'Progress erased';
      rb.classList.remove('armed');
    });
    show('settingsScreen');
  }
  $('#settingsBtn').addEventListener('click', openSettings);

  // ================= lock the screen in place =================
  document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => { e.preventDefault(); });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 300 && !e.target.closest('button')) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  window.addEventListener('scroll', () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); });

  renderTab();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
